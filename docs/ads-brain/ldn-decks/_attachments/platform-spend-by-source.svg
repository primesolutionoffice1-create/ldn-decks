<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc"><title id="title">Platform spend by source</title><desc id="desc">No imported spend yet.</desc><rect x="0" y="0" width="980" height="420" fill="#f8fafc"/><text x="40" y="54" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Platform Spend by Source</text><text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#435063">Generated from immutable raw export summaries. Spend is imported evidence, not a live account total.</text><rect x="40" y="138" width="900" height="160" rx="10" fill="#ffffff" stroke="#d8dee8"/><text x="68" y="216" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#435063">Import platform exports to populate this chart.</text><text x="68" y="248" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b">This visual is generated locally from vault state.</text></svg>
