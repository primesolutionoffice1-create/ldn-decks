<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" role="img" aria-labelledby="title desc"><title id="title">Ads Brain operating map</title><desc id="desc">Flow from immutable raw exports through adapters, wiki memory, production checks, and approval-ready reports.</desc><rect x="0" y="0" width="1240" height="330" fill="#f8fafc"/><text x="40" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Ads Brain Operating Map</text><text x="40" y="86" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#435063">Read-only V1: evidence enters from the left; human-approved actions leave on the right.</text><rect x="40" y="118" width="190" height="104" rx="8" fill="#ffffff" stroke="#586f92" stroke-width="3"/><rect x="40" y="118" width="190" height="10" rx="5" fill="#586f92"/><text x="56" y="162" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Raw exports</text><text x="56" y="188" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">.raw files, hashes, manifests</text><line x1="238" y1="170" x2="302" y2="170" stroke="#64748b" stroke-width="2.5"/><path d="M 302 170 l -10 -7 v14 z" fill="#64748b"/><rect x="280" y="118" width="190" height="104" rx="8" fill="#ffffff" stroke="#2f7f87" stroke-width="3"/><rect x="280" y="118" width="190" height="10" rx="5" fill="#2f7f87"/><text x="296" y="162" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Platform adapters</text><text x="296" y="188" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">canonical columns + checks</text><line x1="478" y1="170" x2="542" y2="170" stroke="#64748b" stroke-width="2.5"/><path d="M 542 170 l -10 -7 v14 z" fill="#64748b"/><rect x="520" y="118" width="190" height="104" rx="8" fill="#ffffff" stroke="#965c8d" stroke-width="3"/><rect x="520" y="118" width="190" height="10" rx="5" fill="#965c8d"/><text x="536" y="162" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Wiki memory</text><text x="536" y="188" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">entities, sources, timelines</text><line x1="718" y1="170" x2="782" y2="170" stroke="#64748b" stroke-width="2.5"/><path d="M 782 170 l -10 -7 v14 z" fill="#64748b"/><rect x="760" y="118" width="190" height="104" rx="8" fill="#ffffff" stroke="#c85f4d" stroke-width="3"/><rect x="760" y="118" width="190" height="10" rx="5" fill="#c85f4d"/><text x="776" y="162" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Production checks</text><text x="776" y="188" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">tracking trust before performance</text><line x1="958" y1="170" x2="1022" y2="170" stroke="#64748b" stroke-width="2.5"/><path d="M 1022 170 l -10 -7 v14 z" fill="#64748b"/><rect x="1000" y="118" width="190" height="104" rx="8" fill="#ffffff" stroke="#a88d37" stroke-width="3"/><rect x="1000" y="118" width="190" height="10" rx="5" fill="#a88d37"/><text x="1016" y="162" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Reports + approvals</text><text x="1016" y="188" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">source-cited proposals only</text><text x="40" y="270" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#c85f4d">Guardrail</text><text x="112" y="270" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#172033">No account mutation, no scaling, and no budget advice before tracking/privacy evidence is present.</text></svg>
