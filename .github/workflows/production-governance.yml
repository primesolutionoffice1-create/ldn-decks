name: Production Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate schema
        run: npm run seo:validate-schema

      - name: Link audit
        run: |
          PORT=4177 npm run start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4177/sitemap.xml > /dev/null; then
              break
            fi
            sleep 1
          done

          SEO_AUDIT_ORIGIN=http://127.0.0.1:4177 npm run seo:link-audit

      - name: Local SEO deployment guard
        run: npm run seo:deployment-guard
