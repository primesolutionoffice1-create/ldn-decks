name: Automation Stack Watchdog

# Hits each /api/vapi/* route against production with realistic
# function-call payloads and alerts if anything regresses.
# Pairs with scripts/automation-stack-verify.mjs which exit-codes
# 1 on any failure. GitHub surfaces failures in the Actions tab.

on:
  schedule:
    # Every hour, on the hour. Cheap (one job, ~30s wall time).
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-stack-watchdog
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Vapi + GHL stack
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run verify script
        env:
          BASE_URL: https://ldndecks.com
          # Optional — set in repo secrets once VAPI_WEBHOOK_SECRET is provisioned
          # in Vercel. Without it the auth-enforcement check is SKIP, not FAIL.
          VAPI_WEBHOOK_SECRET: ${{ secrets.VAPI_WEBHOOK_SECRET }}
          OWNER_CELL: ${{ secrets.OWNER_CELL }}
        run: node scripts/automation-stack-verify.mjs
