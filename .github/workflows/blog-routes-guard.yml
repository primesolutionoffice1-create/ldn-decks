name: blog-routes-guard

# Keeps src/lib/blogRoutes.js in sync with the /blog/deck-builder-*-va
# redirects, so internal links and the sitemap never point at a redirect.

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify blog routes match redirects
        run: node scripts/verify-blog-routes.mjs
