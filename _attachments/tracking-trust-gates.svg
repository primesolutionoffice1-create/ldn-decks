<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc"><title id="title">Tracking trust gates</title><desc id="desc">Platform-specific evidence gates required before Ads Brain should trust optimization recommendations.</desc><rect x="0" y="0" width="980" height="420" fill="#f8fafc"/><text x="40" y="54" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Tracking Trust Gates</text><text x="40" y="82" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#435063">First-pass output is tracking trust. Performance recommendations stay blocked until the relevant gate is supported by evidence.</text><rect x="40" y="122" width="410" height="58" rx="8" fill="#ffffff" stroke="#d8dee8"/><circle cx="70" cy="151" r="12" fill="#2f7f87"/><text x="94" y="147" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Google</text><text x="94" y="167" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">Consent Mode v2 + Enhanced Conversions</text><rect x="500" y="122" width="410" height="58" rx="8" fill="#ffffff" stroke="#d8dee8"/><circle cx="530" cy="151" r="12" fill="#586f92"/><text x="554" y="147" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Meta</text><text x="554" y="167" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">Pixel + CAPI dedupe + EMQ</text><rect x="40" y="208" width="410" height="58" rx="8" fill="#ffffff" stroke="#d8dee8"/><circle cx="70" cy="237" r="12" fill="#965c8d"/><text x="94" y="233" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">TikTok</text><text x="94" y="253" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">Pixel + Events API + match keys</text><rect x="500" y="208" width="410" height="58" rx="8" fill="#ffffff" stroke="#d8dee8"/><circle cx="530" cy="237" r="12" fill="#486f44"/><text x="554" y="233" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">LinkedIn</text><text x="554" y="253" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">Insight Tag + CAPI + CRM/QUALIFIED_LEAD</text><rect x="40" y="294" width="410" height="58" rx="8" fill="#ffffff" stroke="#d8dee8"/><circle cx="70" cy="323" r="12" fill="#a88d37"/><text x="94" y="319" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Microsoft</text><text x="94" y="339" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">UET + enhanced/offline conversions</text><rect x="500" y="294" width="410" height="58" rx="8" fill="#ffffff" stroke="#d8dee8"/><circle cx="530" cy="323" r="12" fill="#c85f4d"/><text x="554" y="319" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Apple</text><text x="554" y="339" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#435063">AdServices + AAK + CPP mapping</text></svg>
